name: Production Security & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Strict least-privilege for an app managing capital
permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  # STAGE 1: Deep Security & Secret Auditing
  security-gate:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full history so secret scanners see more than the head snapshot
          fetch-depth: 0

      - name: TruffleHog Secret Verification Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # STAGE 2: Supply Chain Validation
  dependency-gate:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (for audit graph)
        run: npm ci

      - name: Audit Node Modules for Vulnerabilities
        run: npm audit --audit-level=high

  # STAGE 3: Runtime Math & Type Correctness
  runtime-gate:
    name: Runtime & Math Soundness
    needs: [security-gate, dependency-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clean Install Monorepo Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test (TDD verification)
        run: npm run test --workspaces --if-present
